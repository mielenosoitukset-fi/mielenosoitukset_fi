# Include in every PUBLIC mielenosoitukset.fi vhost (HTTP and HTTPS), before
# the catch-all ProxyPass "/". The Hallinto city-grant route is reachable only
# through the internal mTLS vhost; see docs/hallinto-city-grant.md.
#
# Client values for the forwarded workload headers never reach Gunicorn.
RequestHeader unset X-Hallinto-Proxy-Secret early
RequestHeader unset X-SSL-Client-Verify early
RequestHeader unset X-SSL-Client-Cert early

<Location "/internal/">
    Require all denied
</Location>
