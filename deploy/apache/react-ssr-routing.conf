# React public app routing
#
# Include these directives inside the mielenosoitukset.fi TLS VirtualHost,
# before the existing catch-all ProxyPass "/" rule.
#
# Only GET/HEAD requests for routes the React app owns are sent to the app host.
# Everything else keeps its current handler:
#   POST /submit -> Go; other form posts/login/logout -> Flask
#   /admin, /users, /api, /static, feeds, sitemap, robots      -> Flask
#   every page route not listed below                          -> Flask
#
# Rollout and rollback: remove or comment this include. No data changes.
#
# The app host renders metadata only. Page bodies render in the browser, so a
# migrated page response does not query MongoDB.

RewriteEngine On

# App bundle assets are always served by the app host.
ProxyPass        "/app-assets/" "http://127.0.0.1:8090/app-assets/" retry=0
ProxyPassReverse "/app-assets/" "http://127.0.0.1:8090/app-assets/"

# Migrated page GETs. Add one rule per route when its page leaves Flask.
# Keep method conditions so page hosting does not take ownership of mutations.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/$" "http://127.0.0.1:8090/" [P,L]

# Authentication remains in Flask. Only the private React screen is hosted here.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/auth/god$" "http://127.0.0.1:8090/auth/god" [P,L]

# Volunteer campaign page. The host applies the publication gate; the signup
# POST, email confirmation and the slashless redirect stay in Flask.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/kampanja/$" "http://127.0.0.1:8090/kampanja/" [P,L]

# Fundraising page, behind the same publication gate. mod_rewrite matches the
# decoded path; the target is sent percent-encoded and left as written.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/keräys$" "http://127.0.0.1:8090/ker%C3%A4ys" [P,NE,L]

# Contact page on the React host. The form POST goes to Go (docs/go-contact.md),
# activated 20 November 2026 with the maintainer's go: same token check, quotas
# (shared counters with Flask) and queued mail. release_routing.sh refuses this
# include unless Go owns /contact. Revert: comment out the two POST lines and
# deploy (or reload Apache); Flask's handler is unchanged.
RewriteCond %{REQUEST_METHOD} "^POST$"
RewriteRule "^/contact$" "http://127.0.0.1:8091/contact" [P,L]
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/contact$" "http://127.0.0.1:8090/contact" [P,L]

# City admin applications. Go stores the POST and serves the applicant's own
# status list, identifying the user through the Flask session bridge. The
# review, decisions and role grants stay in the Flask admin.
RewriteCond %{REQUEST_METHOD} "^POST$"
RewriteRule "^/kaupunkiadmin$" "http://127.0.0.1:8091/api/city-admin-applications" [P,L]
RewriteCond %{REQUEST_METHOD} "^GET$"
RewriteRule "^/kaupunkiadmin/hakemukset$" "http://127.0.0.1:8091/api/city-admin-applications/mine" [P,L]
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/kaupunkiadmin$" "http://127.0.0.1:8090/kaupunkiadmin" [P,L]

# API documentation only. The YAML and slashless redirect stay in Flask.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/api-docs/$" "http://127.0.0.1:8090/api-docs/" [P,L]

# Read-only information pages. The translator join POST stays in Flask.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/(info|privacy|terms|ohjeet/?|upcoming/translations/)$" "http://127.0.0.1:8090$0" [P,L]

# Analytics event beacons go to Go (docs/go-public-api.md). Go needs
# SITE_ANALYTICS_ENABLED=true in its environment to match Flask's config.yaml.
# Roll back by removing these two lines: Flask writes the same counters.
RewriteCond %{REQUEST_METHOD} "^POST$"
RewriteRule "^/api/analytics/event$" "http://127.0.0.1:8091/api/analytics/event" [P,L]

# Read-only auth bridge (docs/auth-bridge.md). Go runs with AUTH_BRIDGE_ENABLED=true
# and Flask with AUTH_BRIDGE_SCOPES: true. Rollback: remove these two lines (the
# React client then keeps its server-rendered state).
RewriteCond %{REQUEST_METHOD} "^GET$"
RewriteRule "^/api/auth/me$" "http://127.0.0.1:8091/api/auth/me" [P,L]

# Fundraising opening reminder signup, confirmation and removal go to Go
# (docs/fundraising-reminder.md). POST only. The routes answer 404 until the
# Go API's FUNDRAISING_REMINDER switch is on. The query string (the one-click
# unsubscribe token) is passed on.
RewriteCond %{REQUEST_METHOD} "^POST$"
RewriteRule "^/api/fundraising/reminder(/confirm|/unsubscribe)?$" "http://127.0.0.1:8091$0" [P,L]

# Developer panel data and writes (docs/developer-react-write-controls.md). Go answers
# 401 without a session and serves the writes only with DEVELOPER_WRITES_ENABLED=true;
# the page rules below send /developer here. Go validates ids and methods itself.
# Rollback: remove this rule together with the two /developer page rules.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD|POST|DELETE)$"
RewriteRule "^/api/developer/(overview|apps|apps/[a-fA-F0-9]{24}(/(token|rotate))?|tokens|tokens/[A-Za-z0-9_-]{1,128})$" "http://127.0.0.1:8091$0" [P,L]

# Pride banner carrier signup, confirmation and one-click removal go to Go
# (docs/pride-banner-volunteers.md). Go answers 404 until PRIDE_BANNER_SIGNUP_ENABLED
# is set and the unique index exists. Rollback: remove this rule.
RewriteCond %{REQUEST_METHOD} "^POST$"
RewriteRule "^/api/pride-banner/volunteer(/confirm|/unsubscribe)?$" "http://127.0.0.1:8091$0" [P,L]

# Campaign opening interest signup, confirmation and one-click removal go to Go
# (docs/campaign-opening-interest.md). Go answers 404 until OPENING_INTEREST_SIGNUP_ENABLED
# is set and the unique index exists. Rollback: remove this rule.
RewriteCond %{REQUEST_METHOD} "^POST$"
RewriteRule "^/api/campaign-opening/interest(/confirm|/unsubscribe)?$" "http://127.0.0.1:8091$0" [P,L]

# Activate only after Go intake and the Flask delivery worker are configured.
# The nested Facebook import endpoint retains its Flask handler.
RewriteCond %{REQUEST_METHOD} "^POST$"
RewriteRule "^/submit$" "http://127.0.0.1:8091/api/submissions" [P,L]
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/submit$" "http://127.0.0.1:8090/submit" [P,L]

# Month/year calendars, including canonical city-scoped views. GET/HEAD only.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/calendar(/[0-9]{4}(/[0-9]{1,2})?)?/?$" "http://127.0.0.1:8090$0" [P,L]
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/city/[^/]+/calendar(/[0-9]{4}(/[0-9]{1,2})?)?/?$" "http://127.0.0.1:8090$0" [P,L]

# City discovery and today's listings. Only these exact GET/HEAD routes move.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/(cities|mielenosoitukset-tanaan|city/[^/]+/tanaan)$" "http://127.0.0.1:8090$0" [P,L]

# Ordinary listings. Other nested paths keep their existing handlers.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/(demonstrations|city/[^/]+|tag/[^/]+)$" "http://127.0.0.1:8090$0" [P,L]

# Pride page and its two existing aliases.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/(pride-nakyvaksi|pride/?)$" "http://127.0.0.1:8090$0" [P,L]

# Public organization profiles only. Fill forms, administration and writes retain
# their existing Flask handlers and authorization checks.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/organization/[a-fA-F0-9]{24}$" "http://127.0.0.1:8090$0" [P,L]

# Organization fill-in form. Its suggestion POST goes to Go (rules below).
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/organization/[a-fA-F0-9]{24}/fill$" "http://127.0.0.1:8090$0" [P,L]

# Demonstration correction form. Its POST goes to Go (rules below).
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/suggest_change/[a-fA-F0-9]{24}$" "http://127.0.0.1:8090$0" [P,L]

# Suggestion form writes in Go (docs/go-public-api.md), activated 20 November 2026 with
# the maintainer's go. SUGGESTIONS_GO_ENABLED is written by configure_environment.py;
# release_routing.sh refuses this include if Go does not own the route. Flask's handlers
# are unchanged. Revert: re-comment these four lines and deploy (or reload Apache).
RewriteCond %{REQUEST_METHOD} "^POST$"
RewriteRule "^/organization/[a-fA-F0-9]{24}/save_suggestion$" "http://127.0.0.1:8091%{REQUEST_URI}" [P,L]
RewriteCond %{REQUEST_METHOD} "^POST$"
RewriteRule "^/suggest_change/[a-fA-F0-9]{24}$" "http://127.0.0.1:8091%{REQUEST_URI}" [P,L]

# Organizer cancellation link page, activated 12 November 2026 with the
# maintainer's approval. The form POST, token validation and cancellation stay in
# Flask. Revert: re-comment these two lines and reload Apache. The token alphabet
# matches secrets.token_urlsafe.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/cancel_demonstration/[A-Za-z0-9_-]{1,128}$" "http://127.0.0.1:8090$0" [P,L]

# Developer panel (overview and one app). Needs the auth bridge flags on, Go serving
# /api/developer/* and the React write controls (token create, rotate, revoke, scope
# requests). /developer/apps (create form), /developer/docs and every POST stay in
# Flask. Revert: re-comment these four lines and reload Apache.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/developer/?$" "http://127.0.0.1:8090$0" [P,L]
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/developer/apps/[a-fA-F0-9]{24}$" "http://127.0.0.1:8090$0" [P,L]

# Public profile page and its data (docs/account-pages-react.md), activated 19 November 2026
# with the maintainer's go. Needs PROFILE_READS: true in config.yaml (Go serves /api/profile/*).
# /users/profile/edit, /users/profile/api/* and every POST stay in Flask. Revert: re-comment
# these five lines and reload Apache.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/api/profile/[A-Za-z0-9_.-]{1,64}$" "http://127.0.0.1:8091$0" [P,L]
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteCond %{REQUEST_URI} !^/users/profile/edit/?$
RewriteRule "^/users/profile/[a-z0-9_-]{3,30}/?$" "http://127.0.0.1:8090$0" [P,L]

# Account settings page and its data (docs/account-pages-react.md, step 2), activated
# 20 November 2026 with the maintainer's go. Password, MFA and passkey changes are in the
# React page (#1224, #1227, #1228). Needs the auth bridge; Go's settings read is on by
# default with it (ACCOUNT_SETTINGS_READS: false in config.yaml opts out).
# /users/auth/settings?legacy=1 stays on the unchanged Flask page as a fallback (Flask
# ignores the query string). POSTs to /users/auth/api/v2/* always stay in Flask.
# Revert: re-comment these five lines and reload Apache.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/api/account/settings$" "http://127.0.0.1:8091$0" [P,L]
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteCond %{QUERY_STRING} "!(^|&)legacy=1(&|$)"
RewriteRule "^/users/auth/settings/?$" "http://127.0.0.1:8090$0" [P,L]
# Bio write (step 3a): also needs ACCOUNT_SETTINGS_WRITES: true. Do NOT activate before
# the settings rules above; same go and revert rule (re-comment and reload Apache).
#RewriteCond %{REQUEST_METHOD} "^POST$"
#RewriteRule "^/api/account/profile$" "http://127.0.0.1:8091$0" [P,L]
# Account deletion request (docs/account-erasure.md): also needs ACCOUNT_SETTINGS_WRITES: true;
# activate together with the write rule above, same go and revert rule.
#RewriteCond %{REQUEST_METHOD} "^POST$"
#RewriteRule "^/api/account/deletion-request$" "http://127.0.0.1:8091$0" [P,L]

# Password reset request page (React). The form POST, the mail and the redirect stay in
# Flask (same answer whether or not the address exists). Revert: comment out these two lines.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/users/auth/password_reset_request$" "http://127.0.0.1:8090$0" [P,L]

# Login page (React). Only GET/HEAD: the password and MFA POSTs, /2fa_check, the passkey
# API, throttling and every post-login redirect stay in Flask. A signed-in visitor is sent
# back with legacy=1, which Flask answers with its usual redirect to the safe next page.
# Revert: comment out these three lines.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteCond %{QUERY_STRING} "!(^|&)legacy=1(&|$)"
RewriteRule "^/users/auth/login$" "http://127.0.0.1:8090$0" [P,L]

# Registration page (React). Only GET/HEAD: the POST, its validation, the account insert,
# the confirmation mail and the next-steps page stay in Flask. Revert: comment out these two lines.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/users/auth/register$" "http://127.0.0.1:8090$0" [P,L]

# Only the public status page; /admin/status retains its Flask handler.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteRule "^/status$" "http://127.0.0.1:8090$0" [P,L]

# Demonstration detail and series pages, approved for activation by the maintainer.
#
# Exactly one path segment is claimed: /demonstration/<id>/ics,
# a trailing slash keep their Flask handler. The children route is listed below.
# `preview=1` is how the app host hands a nonpublic event back to the existing
# signed-in preview workflow, so it must reach Flask and is excluded here.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteCond %{QUERY_STRING} "!(^|&)preview=1(&|$)"
RewriteRule "^/demonstration/[^/]+$" "http://127.0.0.1:8090$0" [P,L]
#
# The recurring-series page keeps its `?occurrence=` query string, which the host
# uses to select the occurrence and the browser uses for in-page navigation.
RewriteCond %{REQUEST_METHOD} "^(GET|HEAD)$"
RewriteCond %{QUERY_STRING} "!(^|&)preview=1(&|$)"
RewriteRule "^/demonstration/[^/]+/children$" "http://127.0.0.1:8090$0" [P,L]

# Forward the session cookie unchanged so the app can read the existing
# Flask /api/session summary. No header is added or trusted from the client.
# The app host is told its public origin with its own APP_ORIGIN setting.
ProxyPreserveHost On

# The app host sends its own no-store and nosniff headers for page responses.
# Do not cache HTML in the web server; hashed app assets are cached by the app.
