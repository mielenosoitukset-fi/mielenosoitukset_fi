name: Python shards

on:
  workflow_call:
    inputs:
      browser:
        description: Run only the Chromium tests (the required check skips them).
        type: boolean
        default: false
    secrets:
      MOSO_CI_MONGO_URI:
        required: false

permissions:
  contents: read

jobs:
  shard:
    # Only same-repository PRs and branch dispatches may reach AX41.
    # A merge queue may contain fork code, so it uses a hosted runner.
    runs-on: ${{ github.repository == 'mielenosoitukset-fi/mielenosoitukset_fi' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))) && fromJSON(vars.MOSO_CI_RUNS_ON || '["self-hosted","self-hosted-moso"]') || 'ubuntu-22.04' }}
    timeout-minutes: 30
    env:
      MOSO_BROWSER_TESTS: ${{ inputs.browser && 'only' || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Go public API tools
        uses: actions/setup-go@v6
        with:
          go-version-file: go-api/go.mod
          cache-dependency-path: go-api/go.sum

      - name: Set up frontend build tools
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify frontend types and committed build
        if: matrix.shard == 1
        run: |
          npm ci
          npm run build
          git diff --exit-code -- mielenosoitukset_fi/static/frontend mielenosoitukset_fi/templates/kampanja/_*_fallback.html
          test -z "$(git ls-files --others --exclude-standard -- mielenosoitukset_fi/static/frontend mielenosoitukset_fi/templates/kampanja/_*_fallback.html)"

      - name: Verify the React public host build
        if: matrix.shard == 1
        run: |
          python3 -m pip install "$(sed -n '/^Markdown==/p' requirements.txt)"
          npm run app:build
          node scripts/verify_public_host.mjs
          node scripts/verify_public_availability.mjs
          node scripts/verify_fundraising_bar.mjs
          node --experimental-strip-types scripts/verify_campaign_schedule.mjs
          node --experimental-strip-types scripts/verify_developer_writes.mjs

      - name: Install dependencies
        run: |
          bash deploy/bootstrap_python_trust.sh python
          python -m pip install -r requirements-dev.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}

      - name: Install Chromium for Playwright
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Choose the test MongoDB
        # MongoDB grants exact names. A GitHub runner takes one job at a time.
        # Hosted and unconfigured runners retain their own disposable MongoDB.
        env:
          SHARED_MONGO_URI: ${{ secrets.MOSO_CI_MONGO_URI }}
        run: |
          case "$RUNNER_ENVIRONMENT:$RUNNER_NAME" in
            self-hosted:moso-vm-0[234]) slot="${RUNNER_NAME##*-}" ;;
            *) slot="" ;;
          esac
          if [ -n "$slot" ] && [ -n "$SHARED_MONGO_URI" ]; then
            echo "::add-mask::$SHARED_MONGO_URI"
            {
              echo "SHARED_MONGO=1"
              echo "MOSO_CI_MONGO_SLOT=$slot"
              echo "TEST_MONGO_URI=$SHARED_MONGO_URI"
            } >> "$GITHUB_ENV"
          else
            echo "TEST_MONGO_URI=mongodb://127.0.0.1:27017" >> "$GITHUB_ENV"
          fi

      - name: Start disposable test services
        run: |
          services="mongo redis mailpit localstack"
          if [ -n "$SHARED_MONGO" ]; then services="redis mailpit localstack"; fi
          docker compose -f compose.test.yml up -d $services

      - name: Debug service startup
        run: docker compose -f compose.test.yml ps

      - name: Wait for test services
        run: |
          python - <<'PY'
          import os
          import socket
          import time
          import urllib.request

          checks = [
              ("redis", "socket", ("127.0.0.1", 6379), 2),
              ("mailpit", "http", "http://127.0.0.1:8025/api/v1/info", 2),
              ("localstack", "http", "http://127.0.0.1:4566/_localstack/health", 5),
          ]

          if os.environ.get("SHARED_MONGO"):
              checks.append(("shared mongo", "mongo", os.environ["TEST_MONGO_URI"], 5))
          else:
              checks.append(("mongo", "socket", ("127.0.0.1", 27017), 2))

          deadline = time.time() + 240
          pending = list(checks)

          while pending and time.time() < deadline:
              remaining = []

              for name, check_type, target, timeout in pending:
                  try:
                      if check_type == "mongo":
                          from pymongo import MongoClient

                          MongoClient(target, serverSelectionTimeoutMS=timeout * 1000).admin.command("ping")
                          print(f"✓ {name} is ready")
                      elif check_type == "socket":
                          with socket.create_connection(target, timeout=timeout):
                              print(f"✓ {name} is ready")
                      else:
                          with urllib.request.urlopen(target, timeout=timeout) as response:
                              if response.status >= 400:
                                  raise RuntimeError(f"{name} returned {response.status}")
                              print(f"✓ {name} is ready")
                  except Exception as e:
                      print(f"… {name} not ready yet: {e}")
                      remaining.append((name, check_type, target, timeout))

              pending = remaining
              if not pending:
                  break

              time.sleep(2)

          if pending:
              names = ", ".join(name for name, _, _, _ in pending)
              raise SystemExit(f"⚠ Timed out waiting for: {names}")
          PY

      - name: Show service logs if health checks failed
        if: failure()
        run: docker compose -f compose.test.yml logs --no-color --tail=50



      - name: Reset this runner's shared test databases
        if: env.SHARED_MONGO == '1'
        env:
          SHARD: ${{ matrix.shard }}
        run: python -m tests._ci_mongo_reset start

      - name: Verify Go public API and MongoDB boundaries
        if: matrix.shard == 1
        working-directory: go-api
        env:
          TEST_MONGODB_URI: ${{ env.TEST_MONGO_URI }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...

      - name: Run test suite
        env:
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: "6379"
          TEST_MAIL_HOST: 127.0.0.1
          TEST_MAIL_PORT: "1025"
          TEST_S3_ENDPOINT: http://127.0.0.1:4566
          SHARD: ${{ matrix.shard }}
          SHARDS: "3"
        # Override pytest.ini's quiet flag so stalled runs retain each test ID.
        # Keep every test and the 30-minute job limit. Bound each test including
        # fixture setup/teardown; thread mode also exits on an uninterruptible
        # lock wait and prints thread stacks before failing the job.
        # Each shard takes about a third of the test files, balanced by size, and
        # runs them with two xdist workers (one file stays on one worker).
        run: |
          set -o pipefail
          mapfile -t files < <(python3 scripts/ci_test_shard.py "$SHARD" "$SHARDS")
          echo "shard $SHARD/$SHARDS: ${#files[@]} files"
          python -u -m pytest -o addopts='' -v --tb=short --durations=25 --timeout=180 --timeout-method=thread -o faulthandler_timeout=120 -n 2 --dist loadfile --junitxml=junit-shard.xml "${files[@]}" 2>&1 | tee pytest-shard.log

      - name: Keep this shard's JUnit timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shard-${{ matrix.shard }}
          path: junit-shard.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Dump test service logs on test failure
        if: failure()
        run: docker compose -f compose.test.yml logs --no-color --tail=40

      - name: Drop this runner's shared test databases
        if: always() && env.SHARED_MONGO == '1'
        env:
          SHARD: ${{ matrix.shard }}
        run: python -m tests._ci_mongo_reset finish

      - name: Tear down test services
        if: always()
        run: docker compose -f compose.test.yml down -v

      - name: List the failed tests
        # Last step on purpose: the end of the job log names every failure.
        if: failure()
        run: grep -E '^(FAILED|ERROR) ' pytest-shard.log | cut -c1-240 || true
