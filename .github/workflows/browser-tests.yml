name: Browser tests

# Chromium tests are not part of the required Tests check, so a slow runner
# cannot block merges. They still run on every push to main and nightly.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    uses: ./.github/workflows/python-shards.yml
    with:
      browser: true
