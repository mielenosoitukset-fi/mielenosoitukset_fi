name: Tests

on:
  workflow_dispatch:
  pull_request:
  # Required merge check for the GitHub merge queue: the queue runs this
  # workflow on the temporary merge group commit.
  merge_group:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests-shard:
    # An immutable allowlisted workflow can run on AX41 from a PR merge ref.
    uses: mielenosoitukset-fi/mielenosoitukset_fi/.github/workflows/python-shards.yml@8abb8d7b9d0f249c716f734def980a706ff51427
    secrets:
      MOSO_CI_MONGO_URI: ${{ secrets.MOSO_CI_MONGO_URI }}

  # The required merge check: passes only when every shard passed.
  python-tests:
    needs: python-tests-shard
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: All shards passed
        run: test "${{ needs.python-tests-shard.result }}" = success
