name: Tests

on:
  pull_request:
  # Required merge check for the GitHub merge queue: the queue runs this
  # workflow on the temporary merge group commit.
  merge_group:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests-shard:
    # MongoDB 8 rejects Linux 6.19–7.0.13 (SERVER-121912). The latest
    # Ubuntu 24 runner rolled onto kernel 7.0.0 and cannot start the test DB.
    # Keep the same DB/tests; revisit before Ubuntu 22 retires 2027-04-17.
    #
    # Pushes and same-repository PRs run on the isolated AX41 runners
    # (ci-flask-01..04, label self-hosted-moso, internet only) by default
    # (2026-11-22, Olivia). Set the repository variable MOSO_CI_RUNS_ON to
    # '"ubuntu-22.04"' to move back to GitHub-hosted runners. Fork PRs always
    # stay on GitHub-hosted runners, so untrusted code never reaches our host.
    # The suite runs as four shards side by side, each with pytest-xdist.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-22.04' || fromJSON(vars.MOSO_CI_RUNS_ON || '["self-hosted","self-hosted-moso"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Go public API tools
        uses: actions/setup-go@v6
        with:
          go-version-file: go-api/go.mod
          cache-dependency-path: go-api/go.sum

      - name: Set up frontend build tools
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify frontend types and committed build
        if: matrix.shard == 1
        run: |
          npm ci
          npm run build
          git diff --exit-code -- mielenosoitukset_fi/static/frontend mielenosoitukset_fi/templates/kampanja/_*_fallback.html
          test -z "$(git ls-files --others --exclude-standard -- mielenosoitukset_fi/static/frontend mielenosoitukset_fi/templates/kampanja/_*_fallback.html)"

      - name: Verify the React public host build
        if: matrix.shard == 1
        run: |
          python3 -m pip install "$(sed -n '/^Markdown==/p' requirements.txt)"
          npm run app:build
          node scripts/verify_public_host.mjs
          node scripts/verify_public_availability.mjs
          node scripts/verify_fundraising_bar.mjs
          node --experimental-strip-types scripts/verify_campaign_schedule.mjs
          node --experimental-strip-types scripts/verify_developer_writes.mjs

      - name: Install dependencies
        run: |
          bash deploy/bootstrap_python_trust.sh python
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Pick the test MongoDB image
        # MongoDB 8.0 refuses Linux 6.19-7.0.13 (SERVER-121912); the AX41 runners
        # share the host kernel, so they use 8.2, which starts there.
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then echo "TEST_MONGO_IMAGE=mongo:8.2" >> "$GITHUB_ENV"; fi

      - name: Start disposable test services
        run: docker compose -f compose.test.yml up -d mongo redis mailpit localstack

      - name: Debug service startup
        run: docker compose -f compose.test.yml ps

      - name: Wait for test services
        run: |
          python - <<'PY'
          import socket
          import time
          import urllib.request

          checks = [
              ("mongo", "socket", ("127.0.0.1", 27017), 2),
              ("redis", "socket", ("127.0.0.1", 6379), 2),
              ("mailpit", "http", "http://127.0.0.1:8025/api/v1/info", 2),
              ("localstack", "http", "http://127.0.0.1:4566/_localstack/health", 5),
          ]

          deadline = time.time() + 240
          pending = list(checks)

          while pending and time.time() < deadline:
              remaining = []

              for name, check_type, target, timeout in pending:
                  try:
                      if check_type == "socket":
                          with socket.create_connection(target, timeout=timeout):
                              print(f"✓ {name} is ready")
                      else:
                          with urllib.request.urlopen(target, timeout=timeout) as response:
                              if response.status >= 400:
                                  raise RuntimeError(f"{name} returned {response.status}")
                              print(f"✓ {name} is ready")
                  except Exception as e:
                      print(f"… {name} not ready yet: {e}")
                      remaining.append((name, check_type, target, timeout))

              pending = remaining
              if not pending:
                  break

              time.sleep(2)

          if pending:
              names = ", ".join(name for name, _, _, _ in pending)
              raise SystemExit(f"⚠ Timed out waiting for: {names}")
          PY

      - name: Show service logs if health checks failed
        if: failure()
        run: docker compose -f compose.test.yml logs --no-color --tail=50



      - name: Verify Go public API and MongoDB boundaries
        if: matrix.shard == 1
        working-directory: go-api
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...

      - name: Run test suite
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: "6379"
          TEST_MAIL_HOST: 127.0.0.1
          TEST_MAIL_PORT: "1025"
          TEST_S3_ENDPOINT: http://127.0.0.1:4566
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
        # Override pytest.ini's quiet flag so stalled runs retain each test ID.
        # Keep every test and the 30-minute job limit. Bound each test including
        # fixture setup/teardown; thread mode also exits on an uninterruptible
        # lock wait and prints thread stacks before failing the job.
        # Each shard takes a quarter of the test files, balanced by size, and
        # runs them with four xdist workers (one file stays on one worker).
        run: |
          mapfile -t files < <(python3 scripts/ci_test_shard.py "$SHARD" "$SHARDS")
          echo "shard $SHARD/$SHARDS: ${#files[@]} files"
          python -u -m pytest -o addopts='' -v --tb=short --durations=25 --timeout=180 --timeout-method=thread -o faulthandler_timeout=120 -n 4 --dist loadfile "${files[@]}"

      - name: Dump test service logs on test failure
        if: failure()
        run: docker compose -f compose.test.yml logs --no-color --tail=40

      - name: Tear down test services
        if: always()
        run: docker compose -f compose.test.yml down -v

  # The required merge check: passes only when every shard passed.
  python-tests:
    needs: python-tests-shard
    if: always()
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-22.04' || fromJSON(vars.MOSO_CI_RUNS_ON || '["self-hosted","self-hosted-moso"]') }}
    timeout-minutes: 5
    steps:
      - name: All shards passed
        run: test "${{ needs.python-tests-shard.result }}" = success
